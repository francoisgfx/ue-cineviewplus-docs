# GitHub Pages site for the CineViewPlus user documentation.
# Built by GitHub on every push to main, with the Just the Docs theme.
title: CineViewPlus
description: A fixed-resolution, compositing-style image viewer for Unreal Engine Cinematic Viewports.
url: https://francoisgfx.github.io
baseurl: /ue-cineviewplus-docs

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  "Report an issue":
    - "https://github.com/francoisgfx/ue-cineviewplus-docs/issues/new/choose"
aux_links_new_tab: true

footer_content: "CineViewPlus documentation. Questions and bugs go to <a href=\"https://github.com/francoisgfx/ue-cineviewplus-docs/issues\">GitHub Issues</a>."
