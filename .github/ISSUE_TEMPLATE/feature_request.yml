name: Feature request
description: Suggest an improvement to CineViewPlus.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like CineViewPlus to do?
    validations:
      required: true
